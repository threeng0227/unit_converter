name: unit_converter_pro
description: A fast and lightweight unit converter with beautiful UX and offline support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local database
  hive_flutter: ^1.1.0

  # Internationalization
  intl: ^0.19.0

  # Ads
  google_mobile_ads: ^5.1.0

  # HTTP
  dio: ^5.4.3+1

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0E0F1A"
  image: assets/splash/splash_logo.png
  color_dark: "#0E0F1A"
  image_dark: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo.png
    icon_background_color: "#0E0F1A"
    image_dark: assets/splash/splash_logo.png
    icon_background_color_dark: "#0E0F1A"
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
